spring:
  application:
    name: Wellness

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wellness?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:2592000000}

profile:
  lookback-days: ${PROFILE_LOOKBACK_DAYS:7}

beauty-route:
  require-daily-diagnosis: ${BEAUTY_ROUTE_REQUIRE_DAILY_DIAGNOSIS:false}

openai:
  enabled: ${OPENAI_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.6-sol}
  api-url: ${OPENAI_API_URL:https://api.openai.com/v1/responses}
