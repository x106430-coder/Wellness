spring:
  application:
    name: Wellness

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wellness?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: root
    password: Seokhyeon123$
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:not-today-local-secret-key-2026-must-be-long-enough}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

openai:
  enabled: ${OPENAI_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.6-sol}
  api-url: ${OPENAI_API_URL:https://api.openai.com/v1/responses}
